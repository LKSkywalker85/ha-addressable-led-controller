esphome:
  name: ws28-general-controller-via-esp
  friendly_name: WS28 general controller via ESP
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - lambda: |-
          id(last_control_on) = id(control_light).current_values.is_on();
          auto effect_name = std::string(id(control_light).get_effect_name().c_str());
          id(last_effect_active) = (effect_name != "None");
          id(boot_ready) = true;
      - if:
          condition:
            light.is_on: control_light
          then:
            - if:
                condition:
                  lambda: |-
                    auto effect_name = std::string(id(control_light).get_effect_name().c_str());
                    return effect_name != "None";
                then:
                  - script.execute: mirror_effect_to_physical
                else:
                  - script.execute: mirror_direct_to_physical
          else:
            - light.turn_off: physical_strip

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "XXX"

ota:
  - platform: esphome
    password: "XXX"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Ws28-General-Controller-Via-Esp"
    password: "5fMwSxO86tUe"

captive_portal:

globals:
  - id: wipe_running
    type: bool
    restore_value: no
    initial_value: "false"

  - id: last_control_on
    type: bool
    restore_value: no
    initial_value: "false"

  - id: last_effect_active
    type: bool
    restore_value: no
    initial_value: "false"

  - id: wipe_direction
    type: int
    restore_value: yes
    initial_value: "0"

  - id: boot_ready
    type: bool
    restore_value: no
    initial_value: "false"

  - id: actual_led_count
    type: int
    restore_value: yes
    initial_value: "88"

number:
  - platform: template
    name: "Active LED Count"
    id: active_led_count_slider
    optimistic: true
    restore_value: true
    min_value: 1
    max_value: 1000
    step: 1
    initial_value: 88
    mode: slider
    entity_category: config
    set_action:
      - lambda: |-
          id(actual_led_count) = (int) x;

select:
  - platform: template
    name: "Wipe Direction"
    id: wipe_direction_select
    optimistic: true
    restore_value: true
    entity_category: config
    options:
      - "Left → Right"
      - "Right → Left"
      - "Center → Outside"
      - "Outside → Center"
    initial_option: "Left → Right"
    set_action:
      - lambda: |-
          if (x == "Left → Right") {
            id(wipe_direction) = 0;
          } else if (x == "Right → Left") {
            id(wipe_direction) = 1;
          } else if (x == "Center → Outside") {
            id(wipe_direction) = 2;
          } else if (x == "Outside → Center") {
            id(wipe_direction) = 3;
          }

output:
  - platform: template
    id: control_red
    type: float
    write_action:
      - lambda: return;

  - platform: template
    id: control_green
    type: float
    write_action:
      - lambda: return;

  - platform: template
    id: control_blue
    type: float
    write_action:
      - lambda: return;

light:
  - platform: rgb
    id: control_light
    name: "WS28 LED Strip"
    red: control_red
    green: control_green
    blue: control_blue
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 0s

    effects:
      - lambda:
          name: "Rainbow"
          update_interval: 1s
          lambda: |-
            return;
      - lambda:
          name: "Twinkle"
          update_interval: 1s
          lambda: |-
            return;
      - lambda:
          name: "Piano"
          update_interval: 1s
          lambda: |-
            return;

    on_state:
      then:
        - lambda: |-
            const bool current_on = id(control_light).current_values.is_on();
            auto effect_name = std::string(id(control_light).get_effect_name().c_str());
            const bool effect_active = effect_name != "None";

            if (!id(boot_ready) || id(wipe_running)) {
              return;
            }

            if (current_on != id(last_control_on)) {

              // OFF -> ON
              if (!id(last_control_on) && current_on) {
                id(last_control_on) = true;
                id(last_effect_active) = effect_active;

                if (effect_active) {
                  id(mirror_effect_to_physical).execute();
                } else {
                  id(wipe_on).execute();
                }
                return;
              }

              // ON -> OFF
              if (id(last_control_on) && !current_on) {
                const bool previous_effect_active = id(last_effect_active);

                id(last_control_on) = false;
                id(last_effect_active) = false;

                if (previous_effect_active) {
                  auto call = id(physical_strip).turn_off();
                  call.perform();
                } else {
                  id(wipe_off).execute();
                }
                return;
              }
            }

            if (current_on) {
              id(last_effect_active) = effect_active;

              if (effect_active) {
                id(mirror_effect_to_physical).execute();
              } else {
                id(mirror_direct_to_physical).execute();
              }
            }

  - platform: esp32_rmt_led_strip
    id: physical_strip
    internal: true
    chipset: ws2812
    pin: GPIO4
    num_leds: 1000
    rgb_order: GRB
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

    effects:
      - addressable_lambda:
          name: "Rainbow"
          update_interval: 16ms
          lambda: |-
            const int active_leds = id(actual_led_count);
            const int total_leds = it.size();

            if (initial_run) {
              for (int i = 0; i < total_leds; i++) {
                it[i] = Color::BLACK;
                it[i].set_effect_data(0);
              }
            }

            ESPHSVColor hsv;
            hsv.value = 255;
            hsv.saturation = 240;

            uint16_t hue = (millis() * 10) % 0xFFFF;
            const uint16_t width = 50;
            const uint16_t add = 0xFFFF / width;

            for (int i = 0; i < total_leds; i++) {
              if (i < active_leds) {
                hsv.hue = hue >> 8;
                it[i] = hsv;
                hue += add;
              } else {
                it[i] = Color::BLACK;
                it[i].set_effect_data(0);
              }
            }

      - addressable_lambda:
          name: "Twinkle"
          update_interval: 4ms
          lambda: |-
            static uint32_t last_progress = 0;

            const uint32_t now = millis();
            const uint32_t progress_interval = 4;
            const float twinkle_probability = 0.05f;

            const int active_leds = id(actual_led_count);
            const int total_leds = it.size();

            if (initial_run) {
              last_progress = now;
              for (int i = 0; i < total_leds; i++) {
                it[i] = Color::BLACK;
                it[i].set_effect_data(0);
              }
              return;
            }

            uint8_t pos_add = 0;
            if (now - last_progress > progress_interval) {
              const uint32_t pos_add32 = (now - last_progress) / progress_interval;
              pos_add = pos_add32;
              last_progress += pos_add32 * progress_interval;
            }

            for (int i = 0; i < total_leds; i++) {
              if (i >= active_leds) {
                it[i] = Color::BLACK;
                it[i].set_effect_data(0);
                continue;
              }

              if (it[i].get_effect_data() != 0) {
                const uint8_t sine = half_sin8(it[i].get_effect_data());
                it[i] = current_color * sine;

                const uint8_t old_pos = it[i].get_effect_data();
                const uint8_t new_pos = old_pos + pos_add;

                if (new_pos < old_pos) {
                  it[i].set_effect_data(0);
                } else {
                  it[i].set_effect_data(new_pos);
                }
              } else {
                it[i] = Color::BLACK;
              }
            }

            if (active_leds > 0) {
              while (random_float() < twinkle_probability) {
                const size_t pos = random_uint32() % active_leds;
                if (it[pos].get_effect_data() != 0) {
                  continue;
                }
                it[pos].set_effect_data(1);
              }
            }

      - addressable_lambda:
          name: "Piano"
          update_interval: 50ms
          lambda: |-
            const int active_leds = id(actual_led_count);
            const int total_leds = it.size();

            for (int i = 0; i < total_leds; i++) {
              if (i < active_leds) {
                it[i] = current_color;
              } else {
                it[i] = Color::BLACK;
                it[i].set_effect_data(0);
              }
            }

script:
  - id: mirror_direct_to_physical
    mode: restart
    then:
      - lambda: |-
          auto call = id(physical_strip).turn_on();
          call.set_effect(std::string("None"));
          call.set_brightness(1.0f);
          call.set_red(0.0f);
          call.set_green(0.0f);
          call.set_blue(0.0f);
          call.perform();

      - light.addressable_set:
          id: physical_strip
          range_from: 0
          range_to: !lambda 'return id(actual_led_count) - 1;'
          color_brightness: !lambda 'return id(control_light).current_values.get_brightness();'
          red: !lambda 'return id(control_light).current_values.get_red();'
          green: !lambda 'return id(control_light).current_values.get_green();'
          blue: !lambda 'return id(control_light).current_values.get_blue();'

      - if:
          condition:
            lambda: 'return id(actual_led_count) < 1000;'
          then:
            - light.addressable_set:
                id: physical_strip
                range_from: !lambda 'return id(actual_led_count);'
                range_to: 999
                red: 0%
                green: 0%
                blue: 0%
                color_brightness: 100%

  - id: mirror_effect_to_physical
    mode: restart
    then:
      - lambda: |-
          auto call = id(physical_strip).turn_on();
          call.set_brightness(id(control_light).current_values.get_brightness());
          call.set_red(id(control_light).current_values.get_red());
          call.set_green(id(control_light).current_values.get_green());
          call.set_blue(id(control_light).current_values.get_blue());
          auto effect_name = std::string(id(control_light).get_effect_name().c_str());
          call.set_effect(effect_name);
          call.perform();

  - id: wipe_on
    mode: restart
    then:
      - lambda: 'id(wipe_running) = true;'

      - lambda: |-
          auto call = id(physical_strip).turn_on();
          call.set_effect(std::string("None"));
          call.set_brightness(1.0f);
          call.set_red(0.0f);
          call.set_green(0.0f);
          call.set_blue(0.0f);
          call.perform();

      # Erst kompletten Strip sicher auf aus setzen
      - light.addressable_set:
          id: physical_strip
          range_from: 0
          range_to: 999
          red: 0%
          green: 0%
          blue: 0%
          color_brightness: 100%

      # Left -> Right
      - if:
          condition:
            lambda: 'return id(wipe_direction) == 0;'
          then:
            - repeat:
                count: !lambda 'return id(actual_led_count);'
                then:
                  - light.addressable_set:
                      id: physical_strip
                      range_from: !lambda 'return iteration;'
                      range_to: !lambda 'return iteration;'
                      color_brightness: !lambda 'return id(control_light).current_values.get_brightness();'
                      red: !lambda 'return id(control_light).current_values.get_red();'
                      green: !lambda 'return id(control_light).current_values.get_green();'
                      blue: !lambda 'return id(control_light).current_values.get_blue();'
                  - delay: 15ms

      # Right -> Left
      - if:
          condition:
            lambda: 'return id(wipe_direction) == 1;'
          then:
            - repeat:
                count: !lambda 'return id(actual_led_count);'
                then:
                  - light.addressable_set:
                      id: physical_strip
                      range_from: !lambda 'return id(actual_led_count) - 1 - iteration;'
                      range_to: !lambda 'return id(actual_led_count) - 1 - iteration;'
                      color_brightness: !lambda 'return id(control_light).current_values.get_brightness();'
                      red: !lambda 'return id(control_light).current_values.get_red();'
                      green: !lambda 'return id(control_light).current_values.get_green();'
                      blue: !lambda 'return id(control_light).current_values.get_blue();'
                  - delay: 15ms

      # Center -> Outside
      - if:
          condition:
            lambda: 'return id(wipe_direction) == 2;'
          then:
            - repeat:
                count: !lambda 'return id(actual_led_count) / 2;'
                then:
                  - light.addressable_set:
                      id: physical_strip
                      range_from: !lambda 'return (id(actual_led_count) / 2 - 1) - iteration;'
                      range_to: !lambda 'return (id(actual_led_count) / 2 - 1) - iteration;'
                      color_brightness: !lambda 'return id(control_light).current_values.get_brightness();'
                      red: !lambda 'return id(control_light).current_values.get_red();'
                      green: !lambda 'return id(control_light).current_values.get_green();'
                      blue: !lambda 'return id(control_light).current_values.get_blue();'
                  - light.addressable_set:
                      id: physical_strip
                      range_from: !lambda 'return (id(actual_led_count) / 2) + iteration;'
                      range_to: !lambda 'return (id(actual_led_count) / 2) + iteration;'
                      color_brightness: !lambda 'return id(control_light).current_values.get_brightness();'
                      red: !lambda 'return id(control_light).current_values.get_red();'
                      green: !lambda 'return id(control_light).current_values.get_green();'
                      blue: !lambda 'return id(control_light).current_values.get_blue();'
                  - delay: 15ms

      # Outside -> Center
      - if:
          condition:
            lambda: 'return id(wipe_direction) == 3;'
          then:
            - repeat:
                count: !lambda 'return id(actual_led_count) / 2;'
                then:
                  - light.addressable_set:
                      id: physical_strip
                      range_from: !lambda 'return iteration;'
                      range_to: !lambda 'return iteration;'
                      color_brightness: !lambda 'return id(control_light).current_values.get_brightness();'
                      red: !lambda 'return id(control_light).current_values.get_red();'
                      green: !lambda 'return id(control_light).current_values.get_green();'
                      blue: !lambda 'return id(control_light).current_values.get_blue();'
                  - light.addressable_set:
                      id: physical_strip
                      range_from: !lambda 'return id(actual_led_count) - 1 - iteration;'
                      range_to: !lambda 'return id(actual_led_count) - 1 - iteration;'
                      color_brightness: !lambda 'return id(control_light).current_values.get_brightness();'
                      red: !lambda 'return id(control_light).current_values.get_red();'
                      green: !lambda 'return id(control_light).current_values.get_green();'
                      blue: !lambda 'return id(control_light).current_values.get_blue();'
                  - delay: 15ms

      - script.execute: mirror_direct_to_physical
      - lambda: 'id(wipe_running) = false;'

  - id: wipe_off
    mode: restart
    then:
      - lambda: 'id(wipe_running) = true;'

      # Left -> Right on wipe_on => Right -> Left on wipe_off
      - if:
          condition:
            lambda: 'return id(wipe_direction) == 0;'
          then:
            - repeat:
                count: !lambda 'return id(actual_led_count);'
                then:
                  - light.addressable_set:
                      id: physical_strip
                      range_from: !lambda 'return id(actual_led_count) - 1 - iteration;'
                      range_to: !lambda 'return id(actual_led_count) - 1 - iteration;'
                      red: 0%
                      green: 0%
                      blue: 0%
                  - delay: 10ms

      # Right -> Left on wipe_on => Left -> Right on wipe_off
      - if:
          condition:
            lambda: 'return id(wipe_direction) == 1;'
          then:
            - repeat:
                count: !lambda 'return id(actual_led_count);'
                then:
                  - light.addressable_set:
                      id: physical_strip
                      range_from: !lambda 'return iteration;'
                      range_to: !lambda 'return iteration;'
                      red: 0%
                      green: 0%
                      blue: 0%
                  - delay: 10ms

      # Center -> Outside on wipe_on => Outside -> Center on wipe_off
      - if:
          condition:
            lambda: 'return id(wipe_direction) == 2;'
          then:
            - repeat:
                count: !lambda 'return id(actual_led_count) / 2;'
                then:
                  - light.addressable_set:
                      id: physical_strip
                      range_from: !lambda 'return iteration;'
                      range_to: !lambda 'return iteration;'
                      red: 0%
                      green: 0%
                      blue: 0%
                  - light.addressable_set:
                      id: physical_strip
                      range_from: !lambda 'return id(actual_led_count) - 1 - iteration;'
                      range_to: !lambda 'return id(actual_led_count) - 1 - iteration;'
                      red: 0%
                      green: 0%
                      blue: 0%
                  - delay: 10ms

      # Outside -> Center on wipe_on => Center -> Outside on wipe_off
      - if:
          condition:
            lambda: 'return id(wipe_direction) == 3;'
          then:
            - repeat:
                count: !lambda 'return id(actual_led_count) / 2;'
                then:
                  - light.addressable_set:
                      id: physical_strip
                      range_from: !lambda 'return (id(actual_led_count) / 2 - 1) - iteration;'
                      range_to: !lambda 'return (id(actual_led_count) / 2 - 1) - iteration;'
                      red: 0%
                      green: 0%
                      blue: 0%
                  - light.addressable_set:
                      id: physical_strip
                      range_from: !lambda 'return (id(actual_led_count) / 2) + iteration;'
                      range_to: !lambda 'return (id(actual_led_count) / 2) + iteration;'
                      red: 0%
                      green: 0%
                      blue: 0%
                  - delay: 10ms

      - light.turn_off: physical_strip
      - lambda: 'id(wipe_running) = false;'
